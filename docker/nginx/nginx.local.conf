# Nginx local - một origin :8080 proxy web + api + uploads
# Web/API qua biến + resolver — tránh 502 sau recreate container.

server {
    listen 80;
    server_name localhost 127.0.0.1 web nginx aibeego.com www.aibeego.com app.aibeego.com dev.aibeego.com;

    # Docker DNS — tránh 502 sau khi recreate api/web (nginx cache IP upstream cũ).
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 50M;

    # Local dev: tránh trình duyệt giữ chunk JS cũ sau khi đổi image web (UI lẫn bản).
    location ^~ /_next/static/ {
        set $web_backend "http://web:3000";
        proxy_pass $web_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location / {
        set $web_backend "http://web:3000";
        proxy_pass $web_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
        proxy_cache_bypass $http_upgrade;
    }

    location = /api/landing-pages/revalidate {
        set $web_backend "http://web:3000";
        proxy_pass $web_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
    }

    # Bulk template bundles are limited to 256 MiB by the API; allow multipart overhead.
    location = /api/v1/landing-pages/templates/packs/bulk {
        client_max_body_size 270m;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        set $api_backend "http://api:4000";
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Allow the VIP 100 MiB file cap plus multipart overhead. API still checks each plan.
    location ~ ^/api/v1/(video-transcriptions|work-management|hrm)(/|$) {
        client_max_body_size 110m;
        set $api_backend "http://api:4000";
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
    }

    location /api/ {
        set $api_backend "http://api:4000";
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
    }

    location /uploads/ {
        set $api_backend "http://api:4000";
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
    }

    location /socket.io/ {
        set $api_backend "http://api:4000";
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}


# LANDING_CUSTOM_DOMAIN_V1
map $http_x_forwarded_proto $lp_domain_proto {
    default $scheme;
    https https;
}
server {
    listen 80 default_server;
    server_name _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 20M;
    add_header Cache-Control "private, no-store" always;

    location = /_lp_domain_auth {
        internal;
        set $domain_api "http://api:4000";
        proxy_pass $domain_api/api/v1/landing-pages/public/domains/resolve?host=$host;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host api;
    }
    location = / {
        auth_request /_lp_domain_auth;
        auth_request_set $lp_public_key $upstream_http_x_lp_public_key;
        auth_request_set $lp_page_id $upstream_http_x_lp_page_id;
        set $domain_web "http://web:3000";
        proxy_pass $domain_web/p/$lp_public_key$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
        proxy_set_header X-Real-IP $remote_addr;
        add_header X-LP-Page-Id $lp_page_id always;
        add_header Cache-Control "private, no-store" always;
    }
    location ^~ /api/v1/landing-pages/public/ {
        auth_request /_lp_domain_auth;
        set $domain_api "http://api:4000";
        proxy_pass $domain_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location ~ ^/(?:_next/static/|landing-page-assets/|landing-pages/templates/|brand/|favicon) {
        set $domain_web "http://web:3000";
        proxy_pass $domain_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $lp_domain_proto;
    }
    location /uploads/ {
        auth_request /_lp_domain_auth;
        set $domain_api "http://api:4000";
        proxy_pass $domain_api;
        proxy_set_header Host $host;
    }
    location = /robots.txt { default_type text/plain; return 200 "User-agent: *\nAllow: /\nDisallow: /api/\n"; }
    location / { return 404; }
}
